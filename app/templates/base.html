<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{get('title', 'yle-dl Web Interface')}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 24px;
            color: #fff;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
        }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 14px;
        }
        input[type="url"]:focus {
            outline: none;
            border-color: #0066cc;
        }
        button {
            padding: 12px 24px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover {
            background: #0052a3;
        }
        .info {
            margin-top: 30px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 4px;
            font-size: 14px;
            color: #b0b0b0;
        }
        .info code {
            background: #3a3a3a;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        .status {
            padding: 12px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status.queued { background: #444; color: #fff; }
        .status.downloading { background: #0066cc; color: #fff; }
        .status.completed { background: #00aa00; color: #fff; }
        .status.failed { background: #cc0000; color: #fff; }
        .status.cancelled { background: #886600; color: #fff; }
        .status {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .cancel-btn {
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        .cancel-btn:hover { background: rgba(0, 0, 0, 0.5); }
        .output-container {
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 15px;
            height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
        }
        .output-line {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .back-link, a {
            color: #0066cc;
            text-decoration: none;
        }
        .back-link:hover, a:hover {
            text-decoration: underline;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
        }
        .error { color: #ff4444; }
    </style>
</head>
<body>
    <div class="container">
        {{!base}}
    </div>
</body>
</html>
