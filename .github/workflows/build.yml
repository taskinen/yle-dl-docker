name: Build and push yle-dl Docker image

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: 'yle-dl version to build'
        required: true
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: taskinen/yle-dl

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Signal start
        run: curl -m 10 --retry 5 ${{ vars.YLEDL_SIGNAL_URL }}/start || true
        shell: bash

      - name: Determine version to build
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Get latest version from PyPI if not provided
            VERSION=$(curl -s "https://pypi.org/pypi/yle-dl/json" | jq -r '.info.version')
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
        shell: bash

      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            YLE_DL_VERSION=${{ steps.version.outputs.version }}

  notify-result:
    needs: build-and-push
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Signal build result
        run: |
          if [[ "${{ needs.build-and-push.result }}" == "success" ]]; then
            curl -m 10 --retry 5 ${{ vars.YLEDL_SIGNAL_URL }} || true
          else
            curl -m 10 --retry 5 ${{ vars.YLEDL_SIGNAL_URL }}/fail || true
          fi
        shell: bash
