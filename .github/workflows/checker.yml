name: Check if new version of yle-dl is released

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: taskinen/yle-dl

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Signal start
        run: curl -m 10 --retry 5 ${{ vars.YLEDL_SIGNAL_URL }}/start || true
        shell: bash

      - name: Check if newer yle-dl version is released
        id: version-check
        run: |
          set -euo pipefail

          # Get latest version from PyPI
          LATEST=$(curl -s "https://pypi.org/pypi/yle-dl/json" | jq -r '.info.version')
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest version for yle-dl is currently ${LATEST}"

          # Check if Docker image already exists
          if curl --silent --fail --head "https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${LATEST}/" > /dev/null 2>&1; then
            echo "Docker image for ${LATEST} already exists. Will not build."
            echo "will-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Docker image for ${LATEST} does not exist. Will build."
            echo "will-build=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Trigger build workflow
        if: steps.version-check.outputs.will-build == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              ref: 'master',
              inputs: {
                version: '${{ steps.version-check.outputs.latest }}'
              }
            });
            console.log('Build workflow triggered for version ${{ steps.version-check.outputs.latest }}');

      - name: Signal no build needed
        if: steps.version-check.outputs.will-build == 'false'
        run: curl -m 10 --retry 5 ${{ vars.YLEDL_SIGNAL_URL }} || true
        shell: bash
